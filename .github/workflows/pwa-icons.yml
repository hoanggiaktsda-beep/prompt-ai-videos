name: Build PWA icons
on:
  push:
    branches: [main]
    paths:
      - 'assets/brand-mark.svg'
      - '.github/workflows/pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url="assets/brand-mark.svg",write_to=f"assets/icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/icon-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG icons for PWA installation"
            git push
          fi
